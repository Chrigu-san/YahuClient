name = "yahu-addresses"
main = "src/index.js"
compatibility_date = "2026-10-01"

# the launcher talks to https://api.yahuclient.net
routes = [{ pattern = "api.yahuclient.net", custom_domain = true }]

[vars]
ZONE_NAME = "yahuclient.net"

# names that are taken, with the hash of their secret, last IP and port
# create once with: npx wrangler kv namespace create NAMES   and put the id here
[[kv_namespaces]]
binding = "NAMES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# CF_API_TOKEN is a secret ("Edit zone DNS" for yahuclient.net), set with: npx wrangler secret put CF_API_TOKEN
